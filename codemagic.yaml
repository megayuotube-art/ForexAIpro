workflows:
  flet-android-workflow:
    name: ForexAI 2pro Build
    max_build_duration: 30
    environment:
      vars:
        FLET_PLATFORM: "android"
    scripts:
      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install flet buildozer
      - name: Build APK with Flet / Buildozer
        script: |
          # Python -m o'rniga to'g'ridan-to'g'ri flet build buyrug'idan foydalanamiz
          flet build apk main.py --product "ForexAI 2pro" --org uz.megayuotube
    artifacts:
      - build/*.apk
      - bin/*.apk
      - dist/*.apk
