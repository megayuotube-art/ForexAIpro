workflows:
  flet-android-workflow:
    name: ForexAI 2pro Build
    max_build_duration: 30
    environment:
      vars:
        FLET_PLATFORM: "android"
    scripts:
      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install flet buildozer
      - name: Build APK with Flet
        script: |
          flet build apk . --product "ForexAI 2pro" --org uz.megayuotube --yes
artifacts:
      - "build/app/outputs/flutter-apk/*.apk"
      - "build/apk/*.apk"
      - "*.apk"
