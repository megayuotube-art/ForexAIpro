name: Build ForexAI 2pro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python muhitini o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bog'liqliklar va Flet'ni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet buildozer

      - name: Flet yordamida APK yig'ish
        run: |
          python -m flet pack main.py --product "ForexAI 2pro" --org uz.megayuotube --android

      - name: Yig'ilgan APK faylni saqlash (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ForexAI-2pro-APK
          path: |
            build/*.apk
            bin/*.apk
